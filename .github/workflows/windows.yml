name: windows-first-run

# The commands of docs/WINDOWS.md section 2 on a GitHub-hosted Windows runner, by hand from the Actions tab or on a
# push to a windows/ branch (the porting loop). Every step continues on failure, so one run shows every result, and
# each starts with `set +e` so a failing command still reaches its `echo "exit $?"`. The behavior steps after the
# tests check the decision each hook prints and end with the verdict, so the run's step list reads pass or fail per
# behavior. A hosted runner is a clean Windows machine with Git for Windows, not a developer's workstation, and it has
# no Claude login, so the session hooks are run directly with the JSON a client would send.
#
# The shell is Git Bash by its full path. The runner splits a custom shell line at its first space, so the path is
# written in its short form (PROGRA~1 is C:\Program Files); the Versions step prints which bash that is.

on:
  workflow_dispatch:
  push:
    branches: ['windows/**']

permissions:
  contents: read

jobs:
  first-run:
    runs-on: windows-latest
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned to its commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned the same way
        with:
          node-version: 22
      - name: Versions
        continue-on-error: true
        run: |
          set +e
          node --version; git --version; bash --version | head -1; cmd //c ver
          echo "bash is $(command -v bash) ($(cygpath -w "$(command -v bash)" 2>/dev/null)); uname: $(uname -a)"
          npm install --global @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version || echo "claude install failed"
      - name: A clone into a folder with a space in its path
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$HOME/First Last"
          git clone -q "$GITHUB_WORKSPACE" "$HOME/First Last/skilliton" && echo "cloned to $HOME/First Last/skilliton"
      - name: A delivery check by a bare name, with a decoy of that name in the project folder
        continue-on-error: true
        run: |
          set +e
          # docs/WINDOWS.md section 4: a program started by name may be found in the current folder before PATH. The
          # decoy is whoami.exe copied in as node.exe; it rejects -e, so the check passes only if PATH's node ran.
          K="$HOME/First Last/skilliton"; D="$HOME/decoy try"
          mkdir -p "$D/.skilliton" && cd "$D" && git init -q -b main && echo node.exe >> .git/info/exclude
          cp /c/Windows/System32/whoami.exe ./node.exe
          printf '{"schema":"skilliton.delivery/1","protectedBranches":["main"],"checks":[{"name":"node","command":["node","-e","process.exit(0)"],"timeoutSeconds":60}],"policyPaths":[".skilliton/delivery.json"]}\n' > .skilliton/delivery.json
          git add -A && git -c user.name=t -c user.email=t@example.invalid commit -qm policy
          node "$K/scripts/skilliton.mjs" gate; code=$?; echo "gate exit $code"
          log=$(ls -t .git/skilliton/gate/* 2>/dev/null | head -1); [ -n "$log" ] && head -c 800 "$log"
          if [ "$code" = 0 ]; then echo "PASS bare name: PATH's node ran, not the node.exe in the project folder"; exit 0; fi
          echo "FAIL bare name: the check did not pass; the log above shows whether the decoy ran"; exit 1
      - name: preflight --wide
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node scripts/skilliton.mjs preflight --wide; echo "exit $?"
      - name: help and doctor
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton"
          node scripts/skilliton.mjs --help > /dev/null; echo "help exit $?"
          node scripts/skilliton.mjs doctor; echo "doctor exit $?"
      - name: path-form.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node --test scripts/path-form.test.mjs; echo "exit $?"
      - name: windows-cmd.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node --test scripts/windows-cmd.test.mjs; echo "exit $?"
      - name: allowlist.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node scripts/allowlist.test.mjs; echo "exit $?"
      - name: footprint.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node scripts/footprint.test.mjs; echo "exit $?"
      - name: preflight.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node --test scripts/preflight.test.mjs; echo "exit $?"
      - name: git-config.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node --test scripts/git-config.test.mjs; echo "exit $?"
      - name: prepare.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node --test scripts/prepare.test.mjs; echo "exit $?"
      - name: lifecycle.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && node --test scripts/lifecycle.test.mjs; echo "exit $?"
      - name: handoff-hook.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && bash scripts/handoff-hook.test.sh; echo "exit $?"
      - name: guardrails.test
        continue-on-error: true
        run: |
          set +e
          cd "$HOME/First Last/skilliton" && bash scripts/guardrails.test.sh; echo "exit $?"

      # The behaviors, one step each. Each prints what it got and ends with PASS or FAIL and that exit status.
      - name: "behavior: prepare --apply prepares a new repository"
        continue-on-error: true
        run: |
          set +e
          K="$HOME/First Last/skilliton"
          mkdir -p "$HOME/windows try" && cd "$HOME/windows try"
          git init -q -b main && echo "# a test project" > README.md && git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -qm first
          node "$K/scripts/skilliton.mjs" prepare --dir . --apply > prepare.out 2>&1; code=$?; cat prepare.out; rm -f prepare.out
          # A short reminder wait, so the stop step below can be judged in the same run; committed so the tree starts clean.
          node -e 'const f=".skilliton/config.json",fs=require("fs");const c=JSON.parse(fs.readFileSync(f,"utf8"));c.checkpoints={...(c.checkpoints||{}),minMinutes:0};fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -qm prepared
          if [ "$code" = 0 ] && [ -f .skilliton/config.json ] && [ -f docs/HANDOFF.md ]; then echo "PASS prepare (exit $code)"; exit 0; fi
          echo "FAIL prepare (exit $code)"; exit 1
      - name: "behavior: status reads the prepared project"
        continue-on-error: true
        run: |
          set +e
          K="$HOME/First Last/skilliton"; cd "$HOME/windows try"
          out=$(node "$K/scripts/skilliton.mjs" status --dir . 2>&1); code=$?; echo "$out"
          # On macOS a freshly prepared project gives exit 1 (security evidence needs attention) with the layout OK.
          if [ "$code" = 1 ] && echo "$out" | grep -q "^OK         layout: layout 3" && echo "$out" | grep -q "^ATTENTION  security:"; then echo "PASS status (exit $code, as on macOS)"; exit 0; fi
          echo "FAIL status (exit $code)"; exit 1
      - name: "behavior: the session-start handoff hook prints the handoff"
        continue-on-error: true
        run: |
          set +e
          K="$HOME/First Last/skilliton"; P="$K/packs/base/plugins/workflow"; cd "$HOME/windows try"; W=$(cygpath -w "$PWD" | sed 's/\\/\\\\/g') # the cwd as a Windows client sends it, JSON-escaped
          out=$(printf '{"session_id":"win1","source":"startup","cwd":"%s","hook_event_name":"SessionStart"}' "$W" | CLAUDE_PLUGIN_ROOT="$P" bash "$P/hooks/session-start-handoff.sh" 2>&1); code=$?; echo "$out" | head -20
          if [ "$code" = 0 ] && [ -n "$out" ]; then echo "PASS handoff hook (exit $code)"; exit 0; fi
          echo "FAIL handoff hook (exit $code, $(printf %s "$out" | wc -c) bytes)"; exit 1
      - name: "behavior: hook session-start prints the Project state block"
        continue-on-error: true
        run: |
          set +e
          K="$HOME/First Last/skilliton"; P="$K/packs/base/plugins/workflow"; cd "$HOME/windows try"; W=$(cygpath -w "$PWD" | sed 's/\\/\\\\/g') # the cwd as a Windows client sends it, JSON-escaped
          out=$(printf '{"session_id":"win1","source":"startup","cwd":"%s","hook_event_name":"SessionStart"}' "$W" | CLAUDE_PLUGIN_ROOT="$P" "$P/bin/skilliton" hook session-start 2>&1); code=$?; echo "$out" | head -14
          if [ "$code" = 0 ] && echo "$out" | grep -q "Project state" && echo "$out" | grep -q "Branch: main"; then echo "PASS session-start (exit $code)"; exit 0; fi
          echo "FAIL session-start (exit $code)"; exit 1
      - name: "behavior: hook stop asks for a checkpoint after an edit"
        continue-on-error: true
        run: |
          set +e
          K="$HOME/First Last/skilliton"; P="$K/packs/base/plugins/workflow"; cd "$HOME/windows try"; W=$(cygpath -w "$PWD" | sed 's/\\/\\\\/g')
          echo "an edit" >> README.md
          out=$(printf '{"session_id":"win1","cwd":"%s","hook_event_name":"Stop","stop_hook_active":false}' "$W" | CLAUDE_PLUGIN_ROOT="$P" "$P/bin/skilliton" hook stop 2>&1); code=$?; echo "$out" | head -c 400; echo
          if [ "$code" = 0 ] && echo "$out" | grep -q '"decision":"block"' && echo "$out" | grep -q "checkpoint reminder"; then echo "PASS stop (exit $code)"; exit 0; fi
          echo "FAIL stop (exit $code)"; exit 1
      - name: "behavior: the guard hook, four commands"
        continue-on-error: true
        run: |
          set +e
          cat > "$HOME/guard-cases.sh" <<'CASES'
          K="$HOME/First Last/skilliton"; G="$K/packs/base/plugins/guardrails"; cd "$HOME/windows try"; W=$(cygpath -w "$PWD" | sed 's/\\/\\\\/g')
          fails=0
          guard() { # $1 command, $2 expected decision (none, deny or ask)
            out=$(printf '{"session_id":"win1","cwd":"%s","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"%s"}}' "$W" "$1" | CLAUDE_PLUGIN_ROOT="$G" bash "$G/hooks/guard-bash.sh" 2>&1); code=$?
            got=$(printf %s "$out" | sed -n 's/.*"permissionDecision":"\([a-z]*\)".*/\1/p'); got=${got:-none}
            if [ "$code" = 0 ] && [ "$got" = "$2" ]; then echo "PASS guard [$1]: $got"; else echo "FAIL guard [$1]: exit $code, decision $got, expected $2; output: $(printf %s "$out" | head -c 300)"; fails=$((fails+1)); fi
          }
          guard "git status" none
          guard "git commit --no-verify -m t" deny # skilliton-audit: allow verification-off a test case that sends the flag to the guard
          guard "git push --force origin main" deny
          guard "git checkout -- ." ask
          CASES
          . "$HOME/guard-cases.sh"
          [ "$fails" = 0 ] && { echo "PASS guard (4 of 4)"; exit 0; }
          echo "FAIL guard ($fails of 4 wrong)"; exit 1
      - name: A delivery check started by a bare program name
        continue-on-error: true
        run: |
          set +e
          K="$HOME/First Last/skilliton"
          cd "$HOME/windows try"
          printf '{"schema":"skilliton.delivery/1","protectedBranches":["main"],"checks":[{"name":"node","command":["node","--version"],"timeoutSeconds":60}],"policyPaths":[".skilliton/delivery.json"]}\n' > .skilliton/delivery.json
          node "$K/scripts/skilliton.mjs" gate; echo "gate exit $?"
