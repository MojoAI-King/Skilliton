# Runs every check on each pull request and push to main. A company fork inherits this unchanged.
# Evals (`claude plugin eval`) are not run here: they need a Claude credential and cost money per run.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned to its commit so a moved tag cannot change what runs
        with:
          fetch-depth: 0 # scrub-check --history-all reads every commit on every fetched ref

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned the same way
        with:
          node-version: 22

      - name: Tools the hooks need
        run: |
          for t in jq git bash python3 ssh-keygen tar; do command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }; done
          echo "jq $(jq --version), node $(node --version), git $(git --version)"

      - name: The local check runner reads this list
        run: node scripts/checks.mjs --list

      - name: The local check runner fails the way this workflow fails (bash -eo pipefail, --only)
        run: node --test scripts/checks-runner.test.mjs

      - name: Packaging (marketplace, manifests, skill frontmatter, executable hooks)
        run: node scripts/packs.test.mjs

      - name: Packaging checks can fail
        run: node scripts/packs.test.mjs --self-test

      - name: Guides name real commands and working links
        run: node scripts/docs.test.mjs

      - name: Guides checks can fail
        run: node scripts/docs.test.mjs --self-test

      - name: No current file uses the earlier name
        run: node scripts/names.test.mjs

      - name: Names check can fail
        run: node scripts/names.test.mjs --self-test

      - name: Size ceiling, unused imports, command shape and no dependencies
        run: node scripts/lint.test.mjs

      - name: Lint can fail
        run: node scripts/lint.test.mjs --self-test

      - name: Line length and function length in a plugin runtime (B68)
        run: node scripts/lint-shape.test.mjs

      - name: Lint shape can fail
        run: node scripts/lint-shape.test.mjs --self-test

      - name: Dead code (an export nothing reaches, a block that repeats)
        run: node scripts/deadcode.mjs

      - name: Dead code check can fail
        run: node scripts/deadcode.mjs --self-test

      - name: Report card generator contract
        run: node scripts/report-card.test.mjs

      - name: Report card bars match the batch files
        run: node scripts/report-card.mjs --check

      - name: Report card check can fail
        run: node scripts/report-card.mjs --self-test

      - name: Backlog and its archive agree
        run: node scripts/backlog.test.mjs

      - name: Backlog check can fail
        run: node scripts/backlog.test.mjs --self-test

      - name: Living records stay short and generated
        run: node scripts/living-docs.mjs --check

      - name: Living records check can fail
        run: node scripts/living-docs.mjs --self-test

      - name: Enrollment rehearsal judgement can fail
        run: node scripts/rehearsals/enrollment.mjs --self-test

      - name: The IT allow list matches the code (programs, writes, network)
        run: node scripts/allowlist.test.mjs

      - name: Allow list checks can fail
        run: node scripts/allowlist.test.mjs --self-test

      - name: Small footprint (no network, no admin rights, nothing left running)
        run: node scripts/footprint.test.mjs

      - name: Footprint rules can fail
        run: node scripts/footprint.test.mjs --self-test

      - name: Plugin and marketplace validation (Claude Code CLI)
        run: |
          # Pinned (B46): the version that runs plugin validate --strict changes the verdict; bump on purpose, with the local run recorded in docs/COVERAGE.md.
          npm install --global @anthropic-ai/claude-code@2.1.278
          claude --version
          claude plugin validate --strict .
          for p in packs/*/plugins/*/; do claude plugin validate --strict "$p"; done

      - name: Usage meter (the reference part reports NOT RUN here; the transcripts are on one machine)
        run: node scripts/token-cost.test.mjs --reference
      - name: Usage meter prices every model the transcripts name
        run: node --test scripts/token-cost-models.test.mjs

      - name: The usage ledger (rows appended at maintain time, token counts only, screen readings, the summary's verdict)
        run: node scripts/usage-ledger.test.mjs
      - name: Token direction-of-travel counts (gate runs, read-guard refusals, compactions)
        run: node --test scripts/token-direction.test.mjs
      - name: Read guard hook (context-hygiene)
        run: node --test scripts/read-guard.test.mjs
      - name: Gate command (checks as a verdict, output in a log)
        run: node --test scripts/gate.test.mjs

      - name: A failing gate verdict separates the change from the machine (B77)
        run: node scripts/gate-context.test.mjs

      - name: The delivery gate's rejection keeps the failing test names
        run: node --test scripts/check-tail.test.mjs
      - name: Stack detection (what prepare reads from a repository)
        run: node --test scripts/stack.test.mjs

      - name: Dispatch (lanes, worktrees, briefs, the lane record, merge-back and the refusals)
        run: node --test scripts/dispatch.test.mjs

      - name: Closing a batch marks merged lanes merged and reports their cost and peak context (B82)
        run: node --test scripts/dispatch-close.test.mjs

      - name: Setup (status line apply and undo)
        run: node scripts/setup.test.mjs

      - name: Eval evidence writer
        run: node scripts/evidence.test.mjs

      - name: Session-start checklist hook
        run: bash scripts/hook-fixture.test.sh

      - name: Status line
        run: bash scripts/statusline.test.sh

      - name: Config drift check
        run: bash scripts/drift-check.test.sh

      - name: Session-start handoff hook
        run: bash scripts/handoff-hook.test.sh

      - name: Guardrails hook
        run: bash scripts/guardrails.test.sh

      - name: Guardrails hook, the ways past it found in review (pattern refspecs, deletes, wrappers, the config, quotes)
        run: bash scripts/guardrails-bypass.test.sh

      - name: Guardrails hook, the time limits (a limit is not judged on an overloaded machine, and says so)
        run: bash scripts/guardrails-timing.test.sh

      - name: One set of secret shapes (the runtime scanners and the guardrails hook agree)
        run: node scripts/secret-rules.test.mjs

      - name: Onboarding CLI
        run: node scripts/skilliton.test.mjs

      - name: The skill writers (new-skill, import) never write through a symbolic link
        run: node --test scripts/skill-writers.test.mjs

      - name: Doctor from an installed copy (the marketplace's catalog, CLAUDE_CONFIG_DIR)
        run: node --test scripts/doctor-installed.test.mjs scripts/windows-cmd.test.mjs

      - name: Doctor names one JSON reader as enough, and sends an unprepared repository to prepare
        run: node --test scripts/doctor-tools.test.mjs

      - name: A bare program name resolves against PATH on Windows before it starts (B79)
        run: node --test scripts/resolve-program.test.mjs

      - name: Prepare, migrate, remove, records and indexes
        run: node --test scripts/prepare.test.mjs scripts/migrate.test.mjs scripts/records.test.mjs scripts/root-and-handoff-settings.test.mjs scripts/path-form.test.mjs

      - name: An interrupted prepare --apply recovers by the book
        run: node --test scripts/prepare-interrupt.test.mjs

      - name: A project's own record header (prepare.recordHeader) on every writer and reader
        run: node --test scripts/record-header.test.mjs

      - name: Tasks, checkpoints, status and lifecycle hooks
        run: node scripts/lifecycle.test.mjs

      - name: The first stop of a session that changed files and recorded nothing is held once (holdFirstStop)
        run: node scripts/stop-first.test.mjs

      - name: An edit to a file that was already changed re-arms the stop reminder (a content digest in the fingerprint)
        run: node --test scripts/fingerprint-content.test.mjs

      - name: A session that ended with changes and no checkpoint is said so at the next start
        run: node --test scripts/previous-session.test.mjs

      - name: A hand-written checkpoint is named, and closing a task refreshes the tasks index
        run: node --test scripts/task-records.test.mjs

      - name: A task drifting from its criteria is noticed at the stop hook (B74)
        run: node scripts/task-drift.test.mjs

      - name: A task with many checkpoints or an old first one is noted (B74)
        run: node scripts/checkpoint-growth.test.mjs

      - name: A skill copy that differs from the installed one is named at session start (B76)
        run: node scripts/skill-drift.test.mjs

      - name: The tasks index does not churn on a checkpoint that changes nothing the table shows
        run: node --test scripts/index-churn.test.mjs

      - name: Session liveness (another session looks active, distinct from interrupted)
        run: node --test scripts/session-liveness.test.mjs

      - name: When maintenance is due (the handoff behind, a merge, a day)
        run: node --test scripts/maintain-due.test.mjs

      - name: The stop hook on a clean working tree (no checkpoint reminder; a dirty tree as before)
        run: node --test scripts/stop-clean-tree.test.mjs

      - name: Every workflow hook honors .skilliton-off
        run: node --test scripts/opt-out.test.mjs

      - name: Handoff writer
        run: node --test scripts/handoff-write.test.mjs

      - name: Project security evidence and collectors
        run: node --test scripts/security-evidence.test.mjs scripts/collectors.test.mjs scripts/security-record-refusals.test.mjs scripts/security-propose.test.mjs scripts/security-freshness.test.mjs

      - name: security status --require-collected fails on a missing collector-backed record (B71)
        run: node scripts/security-require.test.mjs

      - name: Security findings in their own file, and migration 0004 (B78)
        run: node scripts/security-findings.test.mjs

      - name: security.findingsFile is checked when the config is read (B78)
        run: node scripts/config-findings-file.test.mjs

      - name: dispatch.contextCeiling is a known key with its range checked
        run: node scripts/config-dispatch-ceiling.test.mjs

      - name: The dispatch reminder reads a numbered lane plan such as LANES-8.md
        run: node scripts/lane-plan-file.test.mjs

      - name: A failing gate verdict names other node processes by program and script file only
        run: node scripts/gate-process-label.test.mjs

      - name: The usage ledger is never read or written through a link
        run: node scripts/usage-ledger-links.test.mjs

      - name: Harness, project-settings and dispatch merge never write through a link that leaves the repository
        run: node scripts/write-links.test.mjs

      - name: Maintain refreshes the collector-backed security records that are missing or stale
        run: node --test scripts/maintain-security-collectors.test.mjs

      - name: Releases, signed approval, verify, trust and proposals
        run: node scripts/release.test.mjs

      - name: A signed tag for another version's manifest, or under another name, approves nothing
        run: node --test scripts/release-refusals.test.mjs

      - name: Machine setup with join and undo (stand-in clients)
        run: node --test scripts/join.test.mjs

      - name: Pin moves the marketplace to the release tag, join adds it there (stub client, B18)
        run: node --test scripts/pin-marketplace.test.mjs

      - name: verify names a clone pinned to one release while the installed plugins match another
        run: node --test scripts/verify-pin.test.mjs

      - name: doctor outside a git repository says there is nothing to prepare
        run: node --test scripts/doctor-outside-repo.test.mjs

      - name: Join prints no credential typed into a marketplace URL
        run: node --test scripts/join-redact.test.mjs

      - name: Company init prints no credential typed as a user name
        run: node --test scripts/fork-redact.test.mjs

      - name: Preflight against blocks made on purpose (missing, unrunnable, unwritable, unreachable)
        run: node --test scripts/preflight.test.mjs

      - name: A repository's own git configuration cannot start a program
        run: node --test scripts/git-config.test.mjs

      - name: Rename to Skilliton (migration 0003 on a project the earlier release prepared, earlier state reported)
        run: node --test scripts/rename.test.mjs

      - name: Trusted delivery gate
        run: node scripts/delivery.test.mjs

      - name: The delivery gate cannot be switched off or rewritten by what a push carries
        run: node --test scripts/delivery-integrity.test.mjs

      - name: The delivery gate protects the program that runs its checks
        run: node --test scripts/delivery-protect.test.mjs

      - name: The self-running audit (six rules, planted flaws, the pre-push hook)
        run: node scripts/audit.test.mjs

      - name: The self-running audit can fail on each of its checks
        run: node scripts/audit.test.mjs --self-test

      - name: The audit over every file this repository has ever changed
        run: node scripts/skilliton.mjs audit --range "$(git rev-list --max-parents=0 HEAD)"..HEAD

      - name: Every collector-backed control has a record (security status --require-collected, B71)
        run: node scripts/skilliton.mjs security status --require-collected

      # 05-03 item 2. The register's evidence is produced by a machine on every push rather than by a person once.
      # The records land in this throwaway workspace and are never committed, so the run's log is the evidence.
      # A collector records gap or observed and still exits 0, because the assessment is the content of the record
      # and the exit status says only whether the collection completed. What refuses a real secret is the audit
      # step above, whose high-confidence rules carry a reason on every allowed line, plus the scrub check below.
      - name: Security collectors over this repository, recorded as evidence
        run: |
          echo "collect tests is not run here: this repository's delivery policy names node scripts/checks.mjs, which is this workflow itself. It is covered by scripts/collectors.test.mjs."
          # The checkout carries this repository's own records since 1.1.0, so count what this run adds, not what exists.
          before=$(ls .skilliton/security/records/*.json 2>/dev/null | wc -l)
          node scripts/skilliton.mjs security collect delivery-policy --apply --reviewer ci
          node scripts/skilliton.mjs security collect secrets --apply --reviewer ci
          n=$(( $(ls .skilliton/security/records/*.json 2>/dev/null | wc -l) - before ))
          echo "--- records written by this run: $n (the checkout held $before)"
          for f in $(ls -t .skilliton/security/records/*.json | head -n "$n"); do jq -r '"\(.controlId) \(.assessment) by \(.reviewer)"' "$f"; done
          [ "$n" -eq 2 ] || { echo "expected 2 records from this run, got $n: a collector completed without writing one"; exit 1; }

      - name: The meter as a command (windows per merged batch, a stubbed meter)
        run: node scripts/usage.test.mjs

      - name: End-to-end demo (disposable project, no model, no network)
        run: node scripts/autopilot-demo.mjs

      - name: The demonstration's five steps (stand-in clients, no model)
        run: node scripts/demo-day.mjs

      - name: Project rehearsal (M1 and M2, offline)
        run: node scripts/rehearsals/projects.mjs --no-evidence

      - name: Public-safety scrub (dashes and home paths; names need the private denylist)
        run: |
          set +e
          bash scripts/scrub-check.sh --history-all
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=Name scan not run::The name denylist is private and not available in CI. Dashes and home paths were scanned; run scrub-check.sh --history locally with your denylist before pushing."
            exit 0
          fi
          exit "$rc"

      - name: Scrub check can fail
        run: |
          printf 'examplenamealpha\n' > "$RUNNER_TEMP/denylist"
          SKILLITON_DENYLIST="$RUNNER_TEMP/denylist" bash scripts/scrub-check.sh --self-test
