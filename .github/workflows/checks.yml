# Runs every check on each pull request and push to main. A company fork inherits this unchanged.
# Evals (`claude plugin eval`) are not run here: they need a Claude credential and cost money per run.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scrub-check --history-all reads every commit on every fetched ref

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tools the hooks need
        run: |
          for t in jq git bash python3 ssh-keygen tar; do command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }; done
          echo "jq $(jq --version), node $(node --version), git $(git --version)"

      - name: Packaging (marketplace, manifests, skill frontmatter, executable hooks)
        run: node scripts/packs.test.mjs

      - name: Packaging checks can fail
        run: node scripts/packs.test.mjs --self-test

      - name: Guides name real commands and working links
        run: node scripts/docs.test.mjs

      - name: Guides checks can fail
        run: node scripts/docs.test.mjs --self-test

      - name: No current file uses the earlier name
        run: node scripts/names.test.mjs

      - name: Names check can fail
        run: node scripts/names.test.mjs --self-test

      - name: Size ceiling, unused imports, command shape and no dependencies
        run: node scripts/lint.test.mjs

      - name: Lint can fail
        run: node scripts/lint.test.mjs --self-test

      - name: Dead code (an export nothing reaches, a block that repeats)
        run: node scripts/deadcode.mjs

      - name: Dead code check can fail
        run: node scripts/deadcode.mjs --self-test

      - name: Report card generator contract
        run: node scripts/report-card.test.mjs

      - name: Report card bars match the batch files
        run: node scripts/report-card.mjs --check

      - name: Report card check can fail
        run: node scripts/report-card.mjs --self-test

      - name: Backlog and its archive agree
        run: node scripts/backlog.test.mjs

      - name: Backlog check can fail
        run: node scripts/backlog.test.mjs --self-test

      - name: Living records stay short and generated
        run: node scripts/living-docs.mjs --check

      - name: Living records check can fail
        run: node scripts/living-docs.mjs --self-test

      - name: Enrollment rehearsal judgement can fail
        run: node scripts/rehearsals/enrollment.mjs --self-test

      - name: The IT allow list matches the code (programs, writes, network)
        run: node scripts/allowlist.test.mjs

      - name: Allow list checks can fail
        run: node scripts/allowlist.test.mjs --self-test

      - name: Small footprint (no network, no admin rights, nothing left running)
        run: node scripts/footprint.test.mjs

      - name: Footprint rules can fail
        run: node scripts/footprint.test.mjs --self-test

      - name: Plugin and marketplace validation (Claude Code CLI)
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version
          claude plugin validate --strict .
          for p in packs/*/plugins/*/; do claude plugin validate --strict "$p"; done

      - name: Usage meter (the reference part reports NOT RUN here; the transcripts are on one machine)
        run: node scripts/token-cost.test.mjs --reference
      - name: Read guard hook (context-hygiene)
        run: node --test scripts/read-guard.test.mjs
      - name: Gate command (checks as a verdict, output in a log)
        run: node --test scripts/gate.test.mjs
      - name: Stack detection (what prepare reads from a repository)
        run: node --test scripts/stack.test.mjs

      - name: Dispatch (lanes, worktrees, briefs, the lane record, merge-back and the refusals)
        run: node --test scripts/dispatch.test.mjs

      - name: Setup (status line apply and undo)
        run: node scripts/setup.test.mjs

      - name: Eval evidence writer
        run: node scripts/evidence.test.mjs

      - name: Session-start checklist hook
        run: bash scripts/hook-fixture.test.sh

      - name: Status line
        run: bash scripts/statusline.test.sh

      - name: Config drift check
        run: bash scripts/drift-check.test.sh

      - name: Session-start handoff hook
        run: bash scripts/handoff-hook.test.sh

      - name: Guardrails hook
        run: bash scripts/guardrails.test.sh

      - name: Onboarding CLI
        run: node scripts/skilliton.test.mjs

      - name: Prepare, migrate, remove, records and indexes
        run: node --test scripts/prepare.test.mjs scripts/migrate.test.mjs scripts/records.test.mjs

      - name: Tasks, checkpoints, status and lifecycle hooks
        run: node scripts/lifecycle.test.mjs

      - name: Handoff writer
        run: node --test scripts/handoff-write.test.mjs

      - name: Project security evidence and collectors
        run: node --test scripts/security-evidence.test.mjs scripts/collectors.test.mjs

      - name: Releases, signed approval, verify, trust and proposals
        run: node scripts/release.test.mjs

      - name: Machine setup with join and undo (stand-in clients)
        run: node --test scripts/join.test.mjs

      - name: Preflight against blocks made on purpose (missing, unrunnable, unwritable, unreachable)
        run: node --test scripts/preflight.test.mjs

      - name: A repository's own git configuration cannot start a program
        run: node --test scripts/git-config.test.mjs

      - name: Rename to Skilliton (migration 0003 on a project the earlier release prepared, earlier state reported)
        run: node --test scripts/rename.test.mjs

      - name: Trusted delivery gate
        run: node scripts/delivery.test.mjs

      - name: End-to-end demo (disposable project, no model, no network)
        run: node scripts/autopilot-demo.mjs

      - name: The demonstration's five steps (stand-in clients, no model)
        run: node scripts/demo-day.mjs

      - name: Project rehearsal (M1 and M2, offline)
        run: node scripts/rehearsals/projects.mjs --no-evidence

      - name: Public-safety scrub (dashes and home paths; names need the private denylist)
        run: |
          set +e
          bash scripts/scrub-check.sh --history-all
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=Name scan not run::The name denylist is private and not available in CI. Dashes and home paths were scanned; run scrub-check.sh --history locally with your denylist before pushing."
            exit 0
          fi
          exit "$rc"

      - name: Scrub check can fail
        run: |
          printf 'examplenamealpha\n' > "$RUNNER_TEMP/denylist"
          SKILLITON_DENYLIST="$RUNNER_TEMP/denylist" bash scripts/scrub-check.sh --self-test
